[project]
name = "ats-backend"
version = "0.1.0"
description = "ATS (Aniruddha Telemetry System) backend — FastAPI + PostgreSQL via psycopg3"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "psycopg[binary,pool]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT==2.14.0",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "anyio==4.12.1",
    "httpx==0.28.1",
    "ruff==0.16.8",
]

# ---------------------------------------------------------------
# Ruff — lint + format (arch. doc §30)
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
]

# ---------------------------------------------------------------
# pytest
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: requires a real PostgreSQL database (deselected with -m 'not integration')",
]
